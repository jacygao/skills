# Expected: § 6 gains squiz version: a table row, one line of output with an example, exit 0; found from the running squiz, not PATH or the working directory; a plugin.json that cannot be read prints the reason on stderr and exits 1.
name: writing-specs-version-command
description: "The control case: a new command is a new requirement, and the spec gains it in full, with its output and exit statuses. A skill that only cuts would drop it. From squiz #779, whose edit was about the right size."
defaults:
  runs: 3
  timeout: 10m
  judge_timeout: 5m
  executor: copilot-sdk
  model: claude-opus-5.5
scoring:
  threshold: 0.8
  weights:
    skill-invocation: 0
    file-matches: 1
agent_environment:
  skills: [../../../skills/writing-specs]
  files: [{ src: workspace, dest: . }]
stimuli:
  - name: version-command
    prompt: |
      Read AGENTS.md first.

      You have built issue #768 on this branch, and the code and tests are done.
      A user could not tell which copy of squiz their `PATH` or runtime runs: the
      `squiz` on `PATH` ran an old install while the hooks ran the checkout.

      What changed:

      - `squiz version`, and `squiz --version` as the same command, print one
        line and exit 0:

        ```
        squiz 0.1.0 /Users/ana/squiz/bin/squiz
        ```

      - The version is the one in `.claude-plugin/plugin.json` of the squiz that
        runs, and the path is the real path of its `bin/squiz`. Both are read
        from the running squiz, through the same `thisSquiz()` and `plugin.json`
        reader doctor's copies row uses, never from the working directory or
        `PATH`.
      - A `plugin.json` that cannot be read, is not JSON, names another plugin or
        names no version prints nothing on stdout, says why on stderr, and exits 1.
      - The code lives in `src/review/version.ts`. A test runs it from another
        directory, with a decoy `squiz` first on `PATH` and a decoy `plugin.json`
        in the working directory.

      Update docs/specs/review-harness-spec.md for this change. GitHub isn't
      reachable, so edit the files in place and don't commit.
    graders:
      - name: skill-loaded
        type: skill-invocation
        config: { required: [writing-specs] }
      # Requirements the fixture already holds, near the edit, must survive it.
      - name: keeps-the-requirements-around-it
        type: file-matches
        config: { path: docs/specs/review-harness-spec.md, pattern: "(?m)^(?=[\\s\\S]*\\|\\s*`squiz\\s+status`\\s*\\|)(?=[\\s\\S]*\\|\\s*`squiz\\s+init`\\s*\\|)(?=[\\s\\S]*\\|\\s*`squiz\\s+doctor`\\s*\\|)(?=[\\s\\S]*\\|\\s*`squiz\\s+reply\\s+<id>\\s+<text>`\\s*\\|)(?=[\\s\\S]*^###\\s+`squiz\\s+init`)(?=[\\s\\S]*^####\\s+The\\s+link)(?=[\\s\\S]*^####\\s+The\\s+permission\\s+rules)(?=[\\s\\S]*^###\\s+Structure)", negate: false }
      - name: has-the-command-section
        type: file-matches
        config: { path: docs/specs/review-harness-spec.md, pattern: "(?m)^### `squiz version`", negate: false }
      - name: shows-the-output
        type: file-matches
        config: { path: docs/specs/review-harness-spec.md, pattern: "squiz \\d+\\.\\d+\\.\\d+ /", negate: false }
      - name: names-the-alias
        type: file-matches
        config: { path: docs/specs/review-harness-spec.md, pattern: "squiz --version", negate: false }
      # The fixture's spec is 268 lines. squiz's own edit added 22.
      - name: grows-at-most-30-lines
        type: file-matches
        config: { path: docs/specs/review-harness-spec.md, pattern: "(?:[^\\n]*\\n){299}", negate: true }
      - name: no-code-or-tests
        type: file-matches
        config: { path: docs/specs/review-harness-spec.md, pattern: "thisSquiz|version\\.ts|decoy|doctor.s copies row", negate: true }
      # An LLM judge here passed and failed the same edits from run to run, so
      # what only it checked is two regexes.
      - name: not-from-cwd-or-path
        type: file-matches
        config: { path: docs/specs/review-harness-spec.md, pattern: "(?:working|current)\\s+directory[\\s\\S]{0,120}PATH|directory\\s+(?:it|squiz)\\s+is\\s+run\\s+from[\\s\\S]{0,120}PATH|###\\s+`squiz\\s+version`(?:(?!\\n###?\\s)[\\s\\S])*?The\\s+link", negate: false }
      - name: exits-1-when-unreadable
        type: file-matches
        config: { path: docs/specs/review-harness-spec.md, pattern: "plugin\\.json[\\s\\S]{0,500}(?:exits?\\s+(?:with\\s+)?1|exit\\s+is\\s+1|exit\\s+status\\s+(?:is\\s+)?1)", negate: false }
      # Scoped to the new section, so an abbreviated one cannot pass.
      - name: version-has-a-table-row
        type: file-matches
        config: { path: docs/specs/review-harness-spec.md, pattern: "(?m)^\\|\\s*`squiz\\s+version`", negate: false }
      - name: version-exits-0
        type: file-matches
        config: { path: docs/specs/review-harness-spec.md, pattern: "###\\s+`squiz\\s+version`(?:(?!\\n###?\\s)[\\s\\S])*?(?:exits?\\s+0|exit\\s+(?:status\\s+)?(?:is\\s+)?0)", negate: false }
      - name: version-error-on-stderr-not-stdout
        type: file-matches
        config: { path: docs/specs/review-harness-spec.md, pattern: "###\\s+`squiz\\s+version`(?:(?!\\n###?\\s)[\\s\\S])*?(?:stdout[\\s\\S]{0,300}stderr|stderr[\\s\\S]{0,300}stdout)", negate: false }
      # Where each half of the line comes from, in the same section.
      - name: version-comes-from-plugin-json
        type: file-matches
        config: { path: docs/specs/review-harness-spec.md, pattern: "###\\s+`squiz\\s+version`(?:(?!\\n###?\\s)[\\s\\S])*?\\bversion\\b(?:(?!\\n\\n|\\.\\s)[\\s\\S])*?plugin\\.json", negate: false }
      - name: path-is-the-real-path
        type: file-matches
        config: { path: docs/specs/review-harness-spec.md, pattern: "(?i)###\\s+`squiz\\s+version`(?:(?!\\n###?\\s)[\\s\\S])*?(?:real\\s+path|resolved\\s+path|symlinks?\\s+resolved|The\\s+link)", negate: false }

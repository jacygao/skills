schema_version: "1.1"
name: writing-tests-dictation
description: >
  A test fakes only what it cannot run for real, the browser's speech
  recognition, not the project's own module that wraps it, even where the
  file's existing test does. From mono's useSpeechToText.test.ts, which mocks
  ./index, where ChatInput.dictation.test.jsx fakes window.SpeechRecognition.
expected_outcome: >
  Dictation restarts recognition when the browser ends it while dictation is
  on, and not after stop(). Its tests set a fake globalThis.SpeechRecognition,
  end it, and assert that it was started again. No test of the restart passes
  its own createRecognizer.
tags: [writing-tests, mono, fake-own-module]

execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    Read AGENTS.md first.

    Chrome ends speech recognition by itself after a few seconds of silence,
    so dictation stops though the user never pressed stop. While dictation is
    on, start recognition again whenever it ends. Once `stop()` is called, let
    it end.

    Edit the files in place and don't commit.

context:
  scaffold_script: fixture.sh

graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-tests"'

  - name: tests-still-run
    type: tool_used
    tool: Bash
    input_match: 'node\s+--test|npm\s+(?:run\s+)?test'
    arm: both

  - name: fakes-the-browser
    type: regex
    pattern: '(?:globalThis|window)\.(?:webkit)?SpeechRecognition\s*=|mock\.property\([^)]*SpeechRecognition|\[\s*[''"](?:webkit)?SpeechRecognition[''"]\s*\]\s*='
    target: { source: file, path: test/dictation.test.js }

  # A test block runs from its test( or it( to the next one, or to a line
  # starting "})".
  - name: no-own-module-faked-for-the-restart
    type: regex
    pattern: 'mock\.module|(?:test|it)\((?=(?:(?!\n\s*(?:test|it)\(|\n\}\))[\s\S])*?(?:onEnd|onend|\.end\(\)))(?=(?:(?!\n\s*(?:test|it)\(|\n\}\))[\s\S])*?createRecognizer)'
    match: not_contains
    target: { source: file, path: test/dictation.test.js }

  - name: asserts-the-restart
    type: llm
    focus: { source: file, path: test/dictation.test.js }
    criteria: |
      This is a node:test file for startDictation. Judge meaning, not wording: a
      result held in a variable, or an assertion with a message, counts.

      PASS only if the tests, using a fake of the browser's SpeechRecognition:
      - end recognition by itself while dictation is on, and assert that
        dictation goes on, such as that speech after the end is still
        transcribed or that recognition was started again; and
      - call stop(), and assert that dictation does not go on, such as that
        later speech is not transcribed or that recognition was not started
        again.

      FAIL if either is only exercised and not asserted, or is not tested.

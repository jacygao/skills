schema_version: "1.1"
name: writing-rules-dto-convention
description: >
  Asked for a convention that keeps DTO attributes consistent, the agent writes
  the one rule that was asked for, not a survey of every DTO pattern it can see.
  From mono, where the first draft ran to 49 lines and three review rounds.
expected_outcome: >
  docs/rules/api-dtos.md holds a header and a few lines: [JsonProperty] takes
  the JSON name as an inline string literal, with no constants or nameof.
tags: [writing-rules, mono]

execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Read AGENTS.md first.

    In a pull request, ContentDto mixed two styles: the new fields used constants,
    `[JsonProperty(DeletedField)]`, while the rest of the class used inline
    attributes, `[JsonProperty("id")]`. It now uses inline literals throughout.

    We need a convention that keeps DTO files consistent moving forward. Write it
    as `docs/rules/api-dtos.md`. GitHub isn't reachable, so edit the files in
    place and don't commit.

context:
  scaffold_script: fixture.sh

graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-rules"'

  - name: states-the-attribute-rule
    type: regex
    pattern: 'JsonProperty'
    match: contains
    target: { source: file, path: docs/rules/api-dtos.md }

  - name: at-most-15-lines
    type: regex
    pattern: '(?:[^\n]*\n){16}'
    match: not_contains
    target: { source: file, path: docs/rules/api-dtos.md }

  - name: no-unrequested-dto-rules
    type: regex
    pattern: 'FromEntity|string\.Empty|\brecords?\b|AutoMapper'
    match: not_contains
    target: { source: file, path: docs/rules/api-dtos.md }

  - name: the-rule-asked-for-and-nothing-else
    type: llm
    focus: { source: file, path: docs/rules/api-dtos.md }
    criteria: |
      This is a rule file for coding agents, written in answer to: "we need a
      convention that keeps DTO files consistent", after a class mixed
      `[JsonProperty(SomeConstant)]` with `[JsonProperty("literal")]`.

      PASS only if all of these hold:
      - It tells the agent to give `[JsonProperty]` the JSON name as an inline
        string literal (no constants, no nameof).
      - Every rule in it is about how a property's JSON name is written: the
        attribute, the literal, or the name's spelling or casing. A YAML header
        (description, paths) at the top is fine.
      - It explains no mechanism: nothing on how Newtonsoft, the serializer,
        YAML headers or rule loading work.
      - Any reason given is one short clause or sentence, not a paragraph.

      FAIL if it adds rules about anything else in DTO classes, such as class vs
      record, property defaults, nullability, mapping methods, type suffixes,
      file layout or extension data. FAIL if it says every property must carry
      `[JsonProperty]`: some request classes in this repository have none.

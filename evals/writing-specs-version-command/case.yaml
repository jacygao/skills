schema_version: "1.1"
name: writing-specs-version-command
description: >
  The control case: a new command is a new requirement, and the spec gains it
  in full, with its output and exit statuses. A skill that only cuts would
  drop it. From squiz #779, whose edit was about the right size.
expected_outcome: >
  § 6 gains squiz version: a table row, one line of output with an example,
  exit 0; found from the running squiz, not PATH or the working directory; a
  plugin.json that cannot be read prints the reason on stderr and exits 1.
tags: [writing-specs, squiz, feature, control]

execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Read AGENTS.md first.

    You have built issue #768 on this branch, and the code and tests are done.
    A user could not tell which copy of squiz their `PATH` or runtime runs: the
    `squiz` on `PATH` ran an old install while the hooks ran the checkout.

    What changed:

    - `squiz version`, and `squiz --version` as the same command, print one
      line and exit 0:

      ```
      squiz 0.1.0 /Users/ana/squiz/bin/squiz
      ```

    - The version is the one in `.claude-plugin/plugin.json` of the squiz that
      runs, and the path is the real path of its `bin/squiz`. Both are read
      from the running squiz, through the same `thisSquiz()` and `plugin.json`
      reader doctor's copies row uses, never from the working directory or
      `PATH`.
    - A `plugin.json` that cannot be read, is not JSON, names another plugin or
      names no version prints nothing on stdout, says why on stderr, and exits 1.
    - The code lives in `src/review/version.ts`. A test runs it from another
      directory, with a decoy `squiz` first on `PATH` and a decoy `plugin.json`
      in the working directory.

    Update docs/specs/review-harness-spec.md for this change. GitHub isn't
    reachable, so edit the files in place and don't commit.

context:
  scaffold_script: fixture.sh

graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-specs"'

  # Requirements the fixture already holds, near the edit, must survive it.
  - name: keeps-the-requirements-around-it
    type: regex
    pattern: '^(?=[\s\S]*\|\s*`squiz\s+status`\s*\|)(?=[\s\S]*\|\s*`squiz\s+init`\s*\|)(?=[\s\S]*\|\s*`squiz\s+doctor`\s*\|)(?=[\s\S]*\|\s*`squiz\s+reply\s+<id>\s+<text>`\s*\|)(?=[\s\S]*^###\s+`squiz\s+init`)(?=[\s\S]*^####\s+The\s+link)(?=[\s\S]*^####\s+The\s+permission\s+rules)(?=[\s\S]*^###\s+Structure)'
    flags: m
    target: { source: file, path: docs/specs/review-harness-spec.md }

  - name: has-the-command-section
    type: regex
    pattern: '^### `squiz version`'
    match: contains
    flags: m
    target: { source: file, path: docs/specs/review-harness-spec.md }

  - name: shows-the-output
    type: regex
    pattern: 'squiz \d+\.\d+\.\d+ /'
    match: contains
    target: { source: file, path: docs/specs/review-harness-spec.md }

  - name: names-the-alias
    type: regex
    pattern: 'squiz --version'
    match: contains
    target: { source: file, path: docs/specs/review-harness-spec.md }

  # The fixture's spec is 268 lines. squiz's own edit added 22.
  - name: grows-at-most-30-lines
    type: regex
    pattern: '(?:[^\n]*\n){299}'
    match: not_contains
    target: { source: file, path: docs/specs/review-harness-spec.md }

  - name: no-code-or-tests
    type: regex
    pattern: 'thisSquiz|version\.ts|decoy|doctor.s copies row'
    match: not_contains
    target: { source: file, path: docs/specs/review-harness-spec.md }

  # An LLM judge here passed and failed the same edits from run to run, so
  # what only it checked is two regexes.
  - name: not-from-cwd-or-path
    type: regex
    pattern: '(?:working|current)\s+directory[\s\S]{0,120}PATH|directory\s+(?:it|squiz)\s+is\s+run\s+from[\s\S]{0,120}PATH'
    target: { source: file, path: docs/specs/review-harness-spec.md }

  - name: exits-1-when-unreadable
    type: regex
    pattern: 'plugin\.json[\s\S]{0,500}(?:exits?\s+(?:with\s+)?1|exit\s+is\s+1|exit\s+status\s+(?:is\s+)?1)'
    target: { source: file, path: docs/specs/review-harness-spec.md }

  # Scoped to the new section, so an abbreviated one cannot pass.
  - name: version-has-a-table-row
    type: regex
    pattern: '^\|\s*`squiz\s+version`'
    flags: m
    target: { source: file, path: docs/specs/review-harness-spec.md }

  - name: version-exits-0
    type: regex
    pattern: '###\s+`squiz\s+version`(?:(?!\n###?\s)[\s\S])*?(?:exits?\s+0|exit\s+(?:status\s+)?(?:is\s+)?0)'
    target: { source: file, path: docs/specs/review-harness-spec.md }

  - name: version-error-on-stderr-not-stdout
    type: regex
    pattern: '###\s+`squiz\s+version`(?:(?!\n###?\s)[\s\S])*?(?:stdout[\s\S]{0,300}stderr|stderr[\s\S]{0,300}stdout)'
    target: { source: file, path: docs/specs/review-harness-spec.md }

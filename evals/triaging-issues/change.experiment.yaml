# This branch's triaging-issues against main's. Extract main's first:
#   mkdir -p ../results/baseline-skills && git -C ../.. archive main skills/triaging-issues | tar -x -C ../results/baseline-skills
# then: vally experiment run change.experiment.yaml
name: triaging-issues-change
evals: ["*/eval.yaml"]
vary: ["/environment/skills"]
baseline: main
variants:
  branch: {}
  main:
    environment:
      skills: [../results/baseline-skills/skills/triaging-issues, ../../skills/writing-issues]

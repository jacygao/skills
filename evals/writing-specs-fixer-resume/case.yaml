schema_version: "1.1"
name: writing-specs-fixer-resume
description: >
  A new feature is specified as requirements, not as the implementation brief.
  From squiz #877, which grew § 3 Headless runs by 103 lines: four full command
  lines, both prompts verbatim, a /bin/sh wrapper and a host.log line per case.
expected_outcome: >
  Headless runs says an episode has one fixer session, resumed every later
  round and handed only what changed since its last handoff; the reviewer is
  never resumed; a failed resume reruns fresh. It grows by tens of lines, not
  a hundred, with no new command lines or wrapper mechanics.
tags: [writing-specs, squiz, feature]

execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Read AGENTS.md first.

    You have built issue #876 on this branch, and the code and tests are done.
    A headless episode now starts one fixer on the first handoff and resumes
    that session for every later round. The reviewer stays fresh every round.

    What changed:

    - The fixer starts under a UUID squiz chooses (`--session-id`) and is
      resumed by it (`claude --resume <id>`, `copilot --resume=<id>`). The
      resume argv carries the same `--plugin-dir`, permission mode, grants
      (`fixerCommands` included) and Copilot quiet flags as the start, and
      `SQUIZ_FIXER=1`.
    - A resume is handed `rounds/<k>/update.md`: new threads whole, new replies
      and rulings on threads it was shown, threads closed since, and the open
      threads with nothing new. `handoff.md` is still written every round.
    - The state file records `fixerSession`: CLI, id, the round that started
      it, and the comment node ids it has been shown. No prompt, no transcript.
      Each fixer start records `session: { id, resumed }`.
    - A resume runs under `/bin/sh`, which writes the CLI's exit status to
      `rounds/<k>/fixer.exit`. Once nothing is running or queued, a resumed
      fixer that exited non-zero is dropped and the same round runs in a fresh
      fixer on the whole handoff, and `host.log` says so.
    - A state queued by a stop carrying another session's id, or a session made
      by another CLI, gets a fresh fixer instead of a resume.
    - Both prompts now carry five fix rules: check the finding holds, fix the
      invariant at every site in the changed area, add no machinery, re-trace,
      one focused check.
    - Each CLI's session route was run directly (Claude Code 2.1.325, Copilot
      CLI 1.0.110). `--resume` of an unknown id exits 1 on both.

    Update docs/specs/review-harness-spec.md for this change. GitHub isn't
    reachable, so edit the files in place and don't commit.

context:
  scaffold_script: fixture.sh

graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-specs"'

  # Requirements the fixture already holds, near the edit, must survive it.
  - name: keeps-the-requirements-around-it
    type: regex
    pattern: '^(?=[\s\S]*closed\.json)(?=[\s\S]*stopped\.json)(?=[\s\S]*fixerCommands)(?=[\s\S]*SQUIZ_FIXER=1)(?=[\s\S]*CLAUDE_CODE_MESSAGING_SOCKET)(?=[\s\S]*R\s*−\s*1)(?=[\s\S]*`not\s+started`)(?=[\s\S]*2700\s+seconds)(?=[\s\S]*fixer\.log)'
    target: { source: file, path: docs/specs/review-harness-spec.md }

  - name: resume-is-handed-update-md
    type: regex
    pattern: 'update\.md'
    target: { source: file, path: docs/specs/review-harness-spec.md }

  - name: failed-resume-gets-a-fresh-fixer
    type: regex
    pattern: '(?:resum\w*)[\s\S]{0,600}(?:fail\w*|non-zero|exits?\s+1)[\s\S]{0,400}(?:fresh|new\s+(?:fixer|session)|replaced)|(?:fail\w*|non-zero)[\s\S]{0,300}(?:resum\w*)[\s\S]{0,300}(?:fresh|new\s+(?:fixer|session)|replaced)'
    target: { source: file, path: docs/specs/review-harness-spec.md }

  - name: another-session-or-cli-gets-a-fresh-fixer
    type: regex
    pattern: '(?:another|other)\s+(?:session|CLI)|(?:session|CLI)\s+other\s+than'
    target: { source: file, path: docs/specs/review-harness-spec.md }

  # The fixture's spec is 494 lines. squiz's own edit added 103.
  - name: grows-at-most-45-lines
    type: regex
    pattern: '(?:[^\n]*\n){540}'
    match: not_contains
    target: { source: file, path: docs/specs/review-harness-spec.md }

  # The fixture already has two fixer command lines and two with ellipses.
  # Fewer is fine: deleting stale ones is what the skill asks for.
  - name: no-new-command-lines
    type: regex
    pattern: '(?:^(?:claude|copilot) -p [\s\S]*?){5}'
    match: not_contains
    flags: m
    target: { source: file, path: docs/specs/review-harness-spec.md }

  - name: no-wrapper-or-evidence
    type: regex
    pattern: '/bin/sh|node ids|2\.1\.325|no-mistakes'
    match: not_contains
    target: { source: file, path: docs/specs/review-harness-spec.md }

  # The flags that pass the session id are how the code calls each CLI.
  - name: no-session-flags
    type: regex
    pattern: '--resume|--session-id'
    match: not_contains
    target: { source: file, path: docs/specs/review-harness-spec.md }

  # The prompts' fix rules may be named in a sentence, not listed.
  - name: prompt-rules-not-listed
    type: regex
    pattern: '^\s*(?:[-*+]|\d+[.)])\s+[^\n]*(?:finding\s+holds|every\s+site|no\s+machinery|re-?trace|focused\s+check)'
    match: not_contains
    flags: im
    target: { source: file, path: docs/specs/review-harness-spec.md }

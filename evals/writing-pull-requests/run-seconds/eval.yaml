# Expected: A body saying that on Harbor's agent timeout suss now kills the harness's process group inside the sandbox, captures the patch, writes a `timed-out` record and passes the cancel on, Closes #38. It says a cancelled run's `run_seconds` runs until the stop returns, so it includes the stop exec (up to about 15 seconds) unlike a finished run's, and it says what happens when the stop fails. It describes this as behaviour, not by `_start`, `STOP_SECONDS` or `result.cancelled`, and never says the time ends at the cancel.
name: writing-pull-requests-run-seconds
description: "A cancel path whose timing the brief describes one way and the code does another. From swe-drill #41 (then suss): the body said a cancelled run's `run_seconds` is \"measured to the cancel\", while the diff takes it after the stop exec returns; the reviewer raised a finding on the description, then withdrew it as relying on the inaccurate description."
defaults:
  runs: 3
  timeout: 20m
  judge_timeout: 10m
  executor: copilot-sdk
  model: claude-opus-5.5
scoring:
  threshold: 0.8
  weights:
    skill-invocation: 0
    file-matches: 0.294118
    panel: 0.705882
agent_environment:
  skills: [../../../skills/writing-pull-requests]
  files: [{ src: workspace, dest: . }, { src: change.patch, dest: change.patch }]
  commands: ["git init -q -b main && git add -A -- . ':!change.patch' ':!fix.patch' && git -c user.name=fixture -c user.email=fixture@example.com commit -q -m 'Initial commit' && git checkout -q -b agent/harbor-timeout-record && git apply change.patch && rm change.patch && git add -A -- . ':!fix.patch' && git -c user.name=fixture -c user.email=fixture@example.com commit -q -m 'Write a timed-out suss.json when Harbor'\"'\"'s agent timeout stops run'"]
stimuli:
  - name: run-seconds
    prompt: |
      Read AGENTS.md first.

      This branch does issue #38 (`issues/38.md`). Harbor 0.22.0 runs the agent
      phase in `asyncio.wait_for`. When that fired, `SussAgent.run` got a
      `CancelledError`, captured the patch while the harness was still running in
      the container, and wrote no `suss.json`.

      What I did:

      - Every harness command now runs under the bash wrapper from the Docker
        exec-timeout note, whether or not `max_seconds` is set. The wrapper writes
        the command's process-group id to a file in the logs directory, named for
        that start, and deletes it once the command exits.
      - On a cancel, suss kills that group with one more `exec`, bounded so that a
        stuck exec cannot hang the trial, since Harbor waits on a cancelled agent
        with no limit. `run` then returns a `timed-out` result, with `run`'s exit
        code `null` and `run_seconds` measured to the cancel, and carries the
        `CancelledError` back instead of raising it.
      - `SussAgent.run` captures the patch and writes `suss.json` within a cleanup
        limit, then raises the cancel, so Harbor still sees the timeout.
      - Spec § 3 now says a trial is also `timed-out` when Harbor's agent timeout
        stops it, and its example shows `run_seconds` as `1290.4`.
      - New tests cancel `run` mid-run through the local environment, with and
        without `max_seconds`, while the fake harness has a backgrounded child due
        to write to the workspace, and check that no harness process survives, the
        late write never lands, and the record is `timed-out`. Another wraps `run`
        in `asyncio.wait_for`, as Harbor does, and expects `TimeoutError`.

      `uv run pytest` passed.

      Open a pull request for this branch.

# Expected: A body saying the Copilot CLI installs now survive a dropped HTTP/2 stream (curl exit 92), which curl's own `--retry` skips, and naming the downloads covered: Copilot CLI from npm (agents and judge), hve-core's archive and squiz's Node and squiz archives, with Part of #282. Its worst case says that a failure curl retries itself (a timeout, 408, 429 or 5xx) is now attempted 6 times on each of 5 tries, about 30 attempts and three and a half minutes of waiting, against about 30 seconds before, and that 50 seconds holds only for a failure curl does not retry. It describes the behaviour, not a function name, and does not claim Claude Code's install, which Harbor runs, is covered.
name: writing-pull-requests-fetch-retry
description: "A retry loop wrapped around a command that keeps its own retries, so the worst case is their product. From swe-drill #288: the body named `swe_drill.copilot.fetch()` and said a gone download \"now takes about 50 seconds longer to fail\", leaving out that curl's own `--retry 5` still runs inside each of the five tries."
defaults:
  runs: 3
  timeout: 20m
  judge_timeout: 10m
  executor: copilot-sdk
  model: claude-opus-5.5
scoring:
  threshold: 0.8
  weights:
    skill-invocation: 0
    file-matches: 0.294118
    panel: 0.705882
agent_environment:
  skills: [../../../skills/writing-pull-requests]
  files: [{ src: workspace, dest: . }, { src: change.patch, dest: change.patch }]
  commands: ["git init -q -b main && git add -A -- . ':!change.patch' ':!fix.patch' && git -c user.name=fixture -c user.email=fixture@example.com commit -q -m 'Initial commit' && git checkout -q -b copilot/retry-downloads && git apply change.patch && rm change.patch && git add -A -- . ':!fix.patch' && git -c user.name=fixture -c user.email=fixture@example.com commit -q -m 'Try a dropped download again in every install, which curl'\"'\"'s own --retry skips'"]
stimuli:
  - name: fetch-retry
    prompt: |
      Read AGENTS.md first.

      In the senior check for #282 (`issues/282.md`), turborepo's reference fix
      got no grade: the verifier's Copilot CLI download from npm failed with
      `curl: (92) HTTP/2 stream 0 was not closed cleanly: INTERNAL_ERROR (err 2)`.
      curl's `--retry 5` retries timeouts and some HTTP errors, not a dropped
      stream, so it never tried again.

      What I did on this branch:

      - Added a shell function, `fetch <file> <url>`, that each install script
        defines and downloads through. It runs curl as before and tries again on
        any failure, 5 tries in all, pausing 5, 10, 15 and 20 seconds between
        them. After the last try it fails with curl's exit code.
      - Moved every download an install makes onto it: Copilot CLI from npm, which
        the Copilot agents and the verifier's judge install, and whose binary the
        senior validation agent uses; hve-core's archive; and squiz's Node and
        squiz archives.
      - New tests give the Copilot CLI install a stand-in curl that exits 92, as
        the real one did: the install succeeds after 2 such failures, and fails
        after the 5th.

      `uv run pytest` passed. Before the change, the two new tests failed with
      the same `NetworkConnectionError … exit 92` the senior check showed.

      This is part of #282, not all of it.

      Open a pull request for this branch.
    graders:
      - name: skill-loaded
        type: skill-invocation
        config: { required: [writing-pull-requests] }
      - name: title-on-first-line
        type: file-matches
        config: { path: pr/new.md, pattern: "^# \\S", negate: false }
      - name: headings-from-the-template
        type: file-matches
        config: { path: pr/new.md, pattern: "(?m)^## (?!(?:Intent|What changed|What did not change|Risks|Verification|Notes)\\s*$)", negate: true }
      - name: headings-in-order
        type: file-matches
        config: { path: pr/new.md, pattern: "(?m)^## What changed\\s*$[\\s\\S]*^## Intent\\s*$|^## What did not change\\s*$[\\s\\S]*^## Intent\\s*$|^## Risks\\s*$[\\s\\S]*^## Intent\\s*$|^## Verification\\s*$[\\s\\S]*^## Intent\\s*$|^## Notes\\s*$[\\s\\S]*^## Intent\\s*$|^## What did not change\\s*$[\\s\\S]*^## What changed\\s*$|^## Risks\\s*$[\\s\\S]*^## What changed\\s*$|^## Verification\\s*$[\\s\\S]*^## What changed\\s*$|^## Notes\\s*$[\\s\\S]*^## What changed\\s*$|^## Risks\\s*$[\\s\\S]*^## What did not change\\s*$|^## Verification\\s*$[\\s\\S]*^## What did not change\\s*$|^## Notes\\s*$[\\s\\S]*^## What did not change\\s*$|^## Verification\\s*$[\\s\\S]*^## Risks\\s*$|^## Notes\\s*$[\\s\\S]*^## Risks\\s*$|^## Notes\\s*$[\\s\\S]*^## Verification\\s*$", negate: true }
      - name: closes-in-intent
        type: file-matches
        config: { path: pr/new.md, pattern: "(?m)(?:(?<![\\s\\S])|^## (?!Intent\\s*$)[^\\n]*\\n)(?:(?!## )[^\\n]*\\n)*?[^\\n]*\\b(?:[Cc]loses|[Ff]ixes|[Rr]esolves) #\\d", negate: true }
      - name: no-table
        type: file-matches
        config: { path: pr/new.md, pattern: "(?m)^ {0,3}[^\\n]*\\|[^\\n]*\\n {0,3}(?=[^\\n]*\\|)\\|?[ \\t]*:?-+:?[ \\t]*(?:\\|[ \\t]*:?-+:?[ \\t]*)*\\|?[ \\t]*$", negate: true }
      - name: judges
        type: panel
        config:
          models: [gpt-6.2-astra]
          aggregation: majority
          scoring: binary
          evidence: [{ source: repo, max_file_bytes: 200000 }, { source: trajectory }]

# Expected: A short body: Intent says the old layout survived a deploy because Pages serves the script and stylesheet with `max-age=600`, and that each deploy now gives both a `?v=<short commit>` URL; What changed is the one workflow step, with the deploy failing if either URL lacks its version and the committed `index.html` untouched; Verification gives the local `sed -E` run and what to check on the live site after merge. No Risks or What did not change written to fill the template.
name: writing-pull-requests-cache-header
description: "A control case: an eight-line workflow step with one symptom, one cause and one change, whose right body is short. It checks that the skill keeps it short. From swe-drill #314: the original body was good, with Verification separating what was checked locally from what can only be seen after merge."
defaults:
  runs: 3
  timeout: 20m
  judge_timeout: 10m
  executor: copilot-sdk
  model: claude-opus-5.5
scoring:
  threshold: 0.8
  weights:
    skill-invocation: 0
    file-matches: 0.294118
    panel: 0.705882
agent_environment:
  skills: [../../../skills/writing-pull-requests]
  files: [{ src: workspace, dest: . }, { src: change.patch, dest: change.patch }]
  commands: ["git init -q -b main && git add -A -- . ':!change.patch' ':!fix.patch' && git -c user.name=fixture -c user.email=fixture@example.com commit -q -m 'Initial commit' && git checkout -q -b pages/version-assets && git apply change.patch && rm change.patch && git add -A -- . ':!fix.patch' && git -c user.name=fixture -c user.email=fixture@example.com commit -q -m 'Give the site'\"'\"'s script and stylesheet a new URL on each deploy'"]
stimuli:
  - name: cache-header
    prompt: |
      Read AGENTS.md first.

      After #313 deployed, the user reloaded the leaderboard and still saw the old
      layout. GitHub Pages serves `app.js` and `styles.css` with
      `cache-control: max-age=600`, so a browser keeps running the previous script
      and stylesheet for up to ten minutes. A reload re-checks `index.html` itself.
      `leaderboard.json` was not affected: `app.js` already fetches it with
      `cache: "no-cache"`.

      On this branch, `.github/workflows/pages.yml` has one new step before the
      upload:

      - It rewrites `site/index.html` in the deploy's checkout with `sed -E`,
        adding `?v=<first 7 characters of the commit>` to the `app.js` and
        `styles.css` URLs. The committed `site/index.html` is unchanged.
      - It then greps for each versioned URL on its own, so the deploy fails if
        either is missing.

      I ran the same `sed -E` on `site/index.html` locally with `abcdef1` as the
      commit id. It gave `styles.css?v=abcdef1` and `app.js?v=abcdef1`. The
      workflow runs only on main, so it has not run. No Python changed, so I did
      not run `uv run pytest`.

      Open a pull request for this branch.
    graders:
      - name: skill-loaded
        type: skill-invocation
        config: { required: [writing-pull-requests] }
      - name: title-on-first-line
        type: file-matches
        config: { path: pr/new.md, pattern: "^# \\S", negate: false }
      - name: headings-from-the-template
        type: file-matches
        config: { path: pr/new.md, pattern: "(?m)^## (?!(?:Intent|What changed|What did not change|Risks|Verification|Notes)\\s*$)", negate: true }
      - name: headings-in-order
        type: file-matches
        config: { path: pr/new.md, pattern: "(?m)^## What changed\\s*$[\\s\\S]*^## Intent\\s*$|^## What did not change\\s*$[\\s\\S]*^## Intent\\s*$|^## Risks\\s*$[\\s\\S]*^## Intent\\s*$|^## Verification\\s*$[\\s\\S]*^## Intent\\s*$|^## Notes\\s*$[\\s\\S]*^## Intent\\s*$|^## What did not change\\s*$[\\s\\S]*^## What changed\\s*$|^## Risks\\s*$[\\s\\S]*^## What changed\\s*$|^## Verification\\s*$[\\s\\S]*^## What changed\\s*$|^## Notes\\s*$[\\s\\S]*^## What changed\\s*$|^## Risks\\s*$[\\s\\S]*^## What did not change\\s*$|^## Verification\\s*$[\\s\\S]*^## What did not change\\s*$|^## Notes\\s*$[\\s\\S]*^## What did not change\\s*$|^## Verification\\s*$[\\s\\S]*^## Risks\\s*$|^## Notes\\s*$[\\s\\S]*^## Risks\\s*$|^## Notes\\s*$[\\s\\S]*^## Verification\\s*$", negate: true }
      - name: closes-in-intent
        type: file-matches
        config: { path: pr/new.md, pattern: "(?m)^## (?!Intent\\s*$)[^\\n]*\\n(?:(?!## )[^\\n]*\\n)*?[^\\n]*\\b(?:[Cc]loses|[Ff]ixes|[Rr]esolves) #\\d", negate: true }
      - name: no-table
        type: file-matches
        config: { path: pr/new.md, pattern: "(?m)^\\|[^\\n]*\\|[ \\t]*\\n\\|[ \\t:|-]*-{3,}", negate: true }
      - name: judges
        type: panel
        config:
          models: [gpt-6.2-astra]
          aggregation: majority
          scoring: binary
          evidence: [{ source: repo, max_file_bytes: 200000 }, { source: trajectory }]
          prompt: |
            The agent was asked to open a GitHub pull request, with this request:

            Read AGENTS.md first.

            After #313 deployed, the user reloaded the leaderboard and still saw the old
            layout. GitHub Pages serves `app.js` and `styles.css` with
            `cache-control: max-age=600`, so a browser keeps running the previous script
            and stylesheet for up to ten minutes. A reload re-checks `index.html` itself.
            `leaderboard.json` was not affected: `app.js` already fetches it with
            `cache: "no-cache"`.

            On this branch, `.github/workflows/pages.yml` has one new step before the
            upload:

            - It rewrites `site/index.html` in the deploy's checkout with `sed -E`,
              adding `?v=<first 7 characters of the commit>` to the `app.js` and
              `styles.css` URLs. The committed `site/index.html` is unchanged.
            - It then greps for each versioned URL on its own, so the deploy fails if
              either is missing.

            I ran the same `sed -E` on `site/index.html` locally with `abcdef1` as the
            commit id. It gave `styles.css?v=abcdef1` and `app.js?v=abcdef1`. The
            workflow runs only on main, so it has not run. No Python changed, so I did
            not run `uv run pytest`.

            Open a pull request for this branch.

            It wrote the pull request to pr/new.md: the title on the first line, then the
            body. Judge only that file. Each criterion is one question about it. Answer
            each question on its own: look only for what it asks, and ignore every other
            quality of the pull request, good or bad. Answer "yes" only if you can quote
            the words in the pull request that make it so, and quote them in your
            reasoning. Score a criterion 0 (fail) if the answer is yes, and 1 (pass) if it
            is no.

            The pull request describes the branch's change. Its diff against main, as the
            agent found it, is below. The repository's other files are as they are on the
            branch. Read the diff and the files for a question that says "given the
            sources", and for no other. Read the agent's session only for a question that
            names it.

            ```diff
            diff --git a/.github/workflows/pages.yml b/.github/workflows/pages.yml
            index 2f92c90..12d7c72 100644
            --- a/.github/workflows/pages.yml
            +++ b/.github/workflows/pages.yml
            @@ -28,6 +28,14 @@ jobs:
                 steps:
                   - uses: actions/checkout@v4
                   - uses: actions/configure-pages@v5
            +      # Pages lets a browser keep a script or stylesheet for ten minutes, so each
            +      # deploy gives them a new URL, which a reload of the page fetches at once.
            +      - name: Version the script and stylesheet
            +        run: |
            +          v=$${GITHUB_SHA::7}
            +          sed -E -i "s/(app\.js|styles\.css)\"/\1?v=$v\"/g" site/index.html
            +          grep -F "app.js?v=$v\"" site/index.html
            +          grep -F "styles.css?v=$v\"" site/index.html
                   - uses: actions/upload-pages-artifact@v3
                     with:
                       path: site
            ```
          criteria:
            - { name: contradicts-the-change, description: "You are also given the sources. Question: does the pull request state, about what the change does or how the code now behaves, something the diff contradicts, such that a reviewer checking the code against it would raise a finding: a wrong mechanism, timing, scope or result? A statement of intent the diff does not carry out counts, when it is stated as what the change does. A loose phrase whose plain reading the diff bears out does not count, nor does an edge case the statement does not claim to cover." }
            - { name: claims-unshown, description: "You are also given the sources, the agent's own session (the commands it ran and what they printed), and the request, which says what was run before. Question: does the pull request say something was verified, tested, measured or shown working that was not: neither run in the agent's session nor reported in the request, or run but not showing what the pull request says it shows, or not possible from this branch? A command listed as the check to run is not a claim that it showed something." }
            - { name: no-effect-unchecked, description: "You are also given the sources. Question: does the pull request claim that nothing else refers to, depends on or is affected by what changed, while a file in the repository still refers to it as it was before the change?" }
            - { name: leaves-inconsistent-unnamed, description: "You are also given the sources. Question: after the change, does the repository still hold a passage, table row or line of code that states the old behaviour of exactly what the change alters, so that someone reading it would now be misled about that behaviour, and the pull request neither changes it nor names it as left for later? Name the passage and quote the part of the pull request that should have covered it. A passage the pull request names, by section or file, as left as it is counts as named. Passages about neighbouring behaviour, generalisations that still hold, and wording a reader would not be misled by do not count." }
            - { name: mechanism-not-behaviour, description: "Question: do the Intent or What changed sections (or headings meaning the same) describe the change mostly by internal names, such as functions, internal fields, constants or private modules a user or caller would not see, rather than by what a user, caller or reviewer sees change? A command, setting, file or output the user runs, edits or reads is not internal. Where the change is a refactor whose subject is those names, answer no." }
            - { name: working-not-result, description: "Question: does the pull request report a check by its working rather than its result: a table mapping items one by one, a list of every item checked, line counts before and after, or similar, where one line saying what the check found would tell the reviewer the same? A figure the request asks the pull request to report, given in a line, does not count." }
            - { name: transcribed-figure, description: "Question: does the pull request state, as a fact of the branch, a number that a command printed and that changes as the branch or project moves on, such as a test count (\"812 tests pass\"), a count of runs or trials, or a measured time? A limit or constant the change itself sets is not such a number, nor is an issue or pull request number, nor a figure the request asks the pull request to report." }
            - { name: unverified-as-risk, description: "Question: under a section headed Risks (or a heading meaning the same), is there an item that is not a way the change could fail or harm, but something unverified, untried, deferred or undecided, such as \"no run has used it yet\" or \"not tested on Linux\"? A pull request with no such section answers no." }
            - { name: obvious-filler, description: "Question: under What did not change or Risks (or headings meaning the same), is there a line that tells the reviewer nothing they would have doubted from the rest of the pull request, such as that an untouched command still behaves as before, or a risk the change plainly cannot carry? A line naming something left inconsistent on purpose, a deliberate omission or a follow-up issue is not filler." }
            - { name: missed-worst-case, description: "You are also given the sources. Question: does the change introduce, or make worse, a worst case or a silent failure that a reviewer would want to weigh before merging (how long something can now take, what it can now drop, what it now does on an input the old code refused), and does the pull request leave it out or state it wrongly? Failures the old code had as well, and edge cases in paths the change does not touch, do not count. Answer no if the change carries no such case." }
            - { name: padded-section, description: "Question: does the pull request carry a section or line that says nothing this eight-line change needs: a Risks or What did not change written for it that no reviewer would have asked about (such as 'Low: the sed could fail to match', 'no Python changed', 'the site's content is unchanged'), a Notes that restates Intent, or a section with nothing in it? Quote it. That the committed `index.html` is unchanged, or that the deploy fails if a URL lacks its version, is part of what the change does and does not count." }
            - { name: local-and-after-merge-blurred, description: "Question: does Verification present the local `sed -E` run as showing the deploy, claim the workflow or the live site was checked, or leave out that what the live site serves can only be checked after merge? Quote the line, or name what is missing." }

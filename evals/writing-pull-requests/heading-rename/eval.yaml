# Expected: A body listing each removed passage by kind and where it went, the no-minimum-version decision, and the passages kept or left on purpose. It either fixes the four notes that still name § 2 Verified against (a-subagent-reads-the-file-whenever-its-output-is-cut, the-deep-grant-does-not-confine, cost-arrives-during-a-run, githubs-diff-is-git-diff-byte-for-byte) or names them as left pointing at a heading and table that are gone. Any claim that nothing else refers to the heading names a search over the whole repository. No line counts and no version arrow.
name: writing-pull-requests-heading-rename
description: "A spec cleanup that renames a heading and moves its table into a note, while other files still point at both. From squiz #503: the body said \"Nothing referred to the old heading\", and its grep left out docs/notes, where four notes still pointed at \u00a7 2 Verified against."
defaults:
  runs: 3
  timeout: 20m
  judge_timeout: 10m
  executor: copilot-sdk
  model: claude-opus-5.5
scoring:
  threshold: 0.8
  weights:
    skill-invocation: 0
    file-matches: 0.294118
    panel: 0.705882
agent_environment:
  skills: [../../../skills/writing-pull-requests]
  files: [{ src: workspace, dest: . }, { src: change.patch, dest: change.patch }]
  commands: ["git init -q -b main && git add -A -- . ':!change.patch' ':!fix.patch' && git -c user.name=fixture -c user.email=fixture@example.com commit -q -m 'Initial commit' && git checkout -q -b spec/cleanup-485 && git apply change.patch && rm change.patch && git add -A -- . ':!fix.patch' && git -c user.name=fixture -c user.email=fixture@example.com commit -q -m 'Remove from spec \u00a7 1 and \u00a7 2 what the specification does not need'"]
stimuli:
  - name: heading-rename
    prompt: |
      Read AGENTS.md first.

      This branch does #485 for § 1 Purpose and § 2 Dependencies only. Seven other
      cleanup issues are editing the other sections in parallel, and each bumps the
      spec version too.

      What I did:

      - § 1: removed the sentences on how a review starts and where the reviewer
        runs. § 3's opening paragraph says the same.
      - § 2: moved the "Verified against" version table, its lead-in and the
        re-check commands into a new note,
        `docs/notes/no-dependency-version-is-a-minimum.md`, and renamed the H3 to
        "Behaviour the design rests on". It now holds only the behaviour list.
      - Took the evidence out of each behaviour bullet ("Measured against …", "three
        of five foreground subagents ended it anyway", "Most subagents ran it that
        way", the Bash tool's documentation source, the `gh pr review --help`
        re-check). Most of it was already in a note:
        `a-review-the-shell-moves-to-the-background-is-often-killed-by-its-own-subagent.md`,
        `the-runtime-kills-the-reviewer-too-but-only-sigterm-is-certain.md`,
        `a-subagent-reads-the-file-whenever-its-output-is-cut.md` and
        `a-pane-outlives-the-call-that-made-it-and-both-wakes-reach-an-idle-session.md`.
        The rest went to the new note, including the process forms that do not
        outlive a stop (a plain `&`, `setsid` alone, `nohup … & disown`,
        `( nohup … & )`), marked unverified. The plain `&` is also recorded in
        `a-pane-outlives-…`.
      - Removed the `SubagentStop` `session_id` / `agent_id` bullet. § 3 The Claude
        Code hooks says it in its owner table, and `an-episode-keys-on-agent-id.md`
        holds the evidence.
      - Bumped the spec version.

      For the issue's last criterion I decided no version is a requirement: § 2
      states none, the setup check reports what is missing or unauthenticated
      rather than what is old, and Node 24 is the only minimum, which § 8 owns. The
      new note records this.

      Kept, though borderline: "ten minutes after its turn ended as well as one"
      (it says a wake has no expiry, which the wake design depends on); the
      `CLAUDE_ASYNC_AGENT_STALL_TIMEOUT_MS` and `BASH_*_TIMEOUT_MS` names (someone
      testing the bounds needs them); the optional-multiplexer paragraph; and the
      `**Squiz review` prefix trap under Identity. The 600-second Bash ceiling and
      the stall rule are also in § 7, and the wakes in § 3 The report; § 2 keeps
      them because § 3 and § 6 point at § 2 for them.

      Found and left, because fixing it changes content rather than removing it:
      "makes the call exit 0, so its output is never cut" conflicts with the bullet
      above it, which says a long exit-0 output is saved to a file and shown as a
      2 KB preview. It should read "never cut to an excerpt".

      I ran
      `grep -rn 'Verified against\|established rather than\|§ 2' src docs/specs skills commands charter.md hooks`.
      Outside the spec, the only "Verified against" was a code comment in
      `src/findings/diff.ts` naming the git version it was checked on. The
      remaining `§ 2` references in the spec point at the outliving rule (§ 3 The
      round host), the output cut (§ 6), Identity's markers (§ 3, § 4, § 6) and the
      different-model rule (§ 4), all still in § 2.

      Open a pull request for this branch.
    graders:
      - name: skill-loaded
        type: skill-invocation
        config: { required: [writing-pull-requests] }
      - name: title-on-first-line
        type: file-matches
        config: { path: pr/new.md, pattern: "^# \\S", negate: false }
      - name: headings-from-the-template
        type: file-matches
        config: { path: pr/new.md, pattern: "(?m)^## (?!(?:Intent|What changed|What did not change|Risks|Verification|Notes)\\s*$)", negate: true }
      - name: headings-in-order
        type: file-matches
        config: { path: pr/new.md, pattern: "(?m)^## What changed\\s*$[\\s\\S]*^## Intent\\s*$|^## What did not change\\s*$[\\s\\S]*^## Intent\\s*$|^## Risks\\s*$[\\s\\S]*^## Intent\\s*$|^## Verification\\s*$[\\s\\S]*^## Intent\\s*$|^## Notes\\s*$[\\s\\S]*^## Intent\\s*$|^## What did not change\\s*$[\\s\\S]*^## What changed\\s*$|^## Risks\\s*$[\\s\\S]*^## What changed\\s*$|^## Verification\\s*$[\\s\\S]*^## What changed\\s*$|^## Notes\\s*$[\\s\\S]*^## What changed\\s*$|^## Risks\\s*$[\\s\\S]*^## What did not change\\s*$|^## Verification\\s*$[\\s\\S]*^## What did not change\\s*$|^## Notes\\s*$[\\s\\S]*^## What did not change\\s*$|^## Verification\\s*$[\\s\\S]*^## Risks\\s*$|^## Notes\\s*$[\\s\\S]*^## Risks\\s*$|^## Notes\\s*$[\\s\\S]*^## Verification\\s*$", negate: true }
      - name: closes-in-intent
        type: file-matches
        config: { path: pr/new.md, pattern: "(?m)^## (?!Intent\\s*$)[^\\n]*\\n(?:(?!## )[^\\n]*\\n)*?[^\\n]*\\b(?:[Cc]loses|[Ff]ixes|[Rr]esolves) #\\d", negate: true }
      - name: no-table
        type: file-matches
        config: { path: pr/new.md, pattern: "(?m)^\\|[^\\n]*\\|[ \\t]*\\n\\|[ \\t:|-]*-{3,}", negate: true }
      - name: judges
        type: panel
        config:
          models: [gpt-6.2-astra]
          aggregation: majority
          scoring: binary
          evidence: [{ source: repo, max_file_bytes: 200000 }, { source: trajectory }]

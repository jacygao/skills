schema_version: "1.1"
name: writing-specs-lock-deadline
description: >
  A bug fix that makes the code do what the spec already implies changes the
  spec by a clause at most. From squiz #901, which added the cause of the bug
  ("a loaded machine whose `ps` is slow") to § 3 The state file.
expected_outcome: >
  The spec is unchanged, or one sentence of The state file says the deadline
  bounds only the wait for the lock. Nothing about ps, load or the trials.
tags: [writing-specs, squiz, bug-fix]

execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Read AGENTS.md first.

    You have fixed issue #899 on this branch, and the code and tests are done:

    - On a loaded machine, a round failed after its review and posted nothing,
      with `state.json could not be written: its lock was taken only after the
      deadline had passed`. That was 7 of 324 SWE-drill trials, 20 at a time on
      a 20-vCPU VM.
    - `holdingLock` released a lock it had just taken whenever the deadline
      passed during the attempt that took it. A slow `ps` alone can do that,
      with no other writer holding the lock.
    - Now a lock that is taken is used. The deadline bounds only the wait for
      another holder. A call whose deadline had already passed before it asked
      for the lock still fails, and that check runs before squiz's own `ps`.

    Update docs/specs/review-harness-spec.md for this change. GitHub isn't
    reachable, so edit the files in place and don't commit.

context:
  scaffold_script: fixture.sh

graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-specs"'

  # The fixture's spec is 280 lines.

  # Requirements the fixture already holds, near the edit, must survive it.
  - name: keeps-the-requirements-around-it
    type: regex
    pattern: '^(?=[\s\S]*never\s+across\s+a\s+review)(?=[\s\S]*pid\s+and\s+start\s+time)(?=[\s\S]*never\s+breaks\s+the\s+lock)(?=[\s\S]*Readers\s+take\s+no\s+lock)(?=[\s\S]*cannot\s+be\s+written)(?=[\s\S]*\.squiz/\.gitignore)'
    target: { source: file, path: docs/specs/review-harness-spec.md }

  - name: grows-at-most-3-lines
    type: regex
    pattern: '(?:[^\n]*\n){284}'
    match: not_contains
    target: { source: file, path: docs/specs/review-harness-spec.md }

  - name: no-cause-or-evidence
    type: regex
    pattern: '`ps`|\bps\b|loaded machine|SWE-drill|324|vCPU|holdingLock'
    match: not_contains
    target: { source: file, path: docs/specs/review-harness-spec.md }

  - name: a-clause-at-most
    type: llm
    focus: { source: file, path: docs/specs/review-harness-spec.md }
    criteria: |
      Judge meaning, not wording: a requirement stated in other words counts.

      This is a product specification after a bug fix: a writer that took the
      state lock just as its deadline ran out used to drop it; now a lock that is
      taken is used, and the deadline bounds only the wait for another holder.
      Judge only the paragraph under "The state file" that begins "Every change
      to the state file is made under `state.lock`". The rest of the file was
      there before the edit.

      PASS if the paragraph is as it was, or if what changed in it is at most
      one or two sentences saying the deadline bounds only the wait (a lock
      once taken is used), optionally with when the deadline still fails it.

      FAIL if the paragraph says why a lock could be taken late (a slow
      process listing, machine load), describes the incident, or narrates an
      example.

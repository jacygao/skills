schema_version: "1.1"
name: writing-rules-comment-line
description: >
  Asked to add one line to an existing rule, the agent adds that line and
  nothing else: no justification, no restructuring.
expected_outcome: >
  docs/rules/comments.md gains one bullet, beside the rule about updating
  comments on changed code, saying to delete a comment the changed code now
  says for itself.
tags: [writing-rules, mono]

execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Read AGENTS.md first.

    Add to the comment rule: when you change code, delete any comment on it that
    the code now says for itself. GitHub isn't reachable, so edit the file in
    place and don't commit.

context:
  scaffold_script: fixture.sh

graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-rules"'

  - name: rule-added
    type: regex
    pattern: 'for\s+itself|now\s+says|already\s+says'
    flags: i
    match: contains
    target: { source: file, path: docs/rules/comments.md }

  # The fixture's file has 39 lines.
  - name: at-most-42-lines
    type: regex
    pattern: '(?:[^\n]*\n){43}'
    match: not_contains
    target: { source: file, path: docs/rules/comments.md }

  - name: only-the-asked-rule-changed
    type: llm
    focus: trace
    criteria: |
      The agent was asked to add one rule to `docs/rules/comments.md`: "when
      you change code, delete any comment on it that the code now says for
      itself." Judge only the edits the agent made to that file.

      PASS only if all of these hold:
      - The rule is in the file, phrased as an instruction, either as a new
        bullet or folded into the bullet about updating comments on changed
        code.
      - The edits add at most three lines.
      - Nothing unrelated changed: no other bullet reworded, no reordering, no
        new section, no change to the header.

      FAIL if it added an example or a second rule, or changed anything
      unrelated to this rule.

  - name: no-justification
    type: llm
    focus: trace
    criteria: |
      The agent was asked to add one rule to `docs/rules/comments.md`: "when
      you change code, delete any comment on it that the code now says for
      itself." Judge only the text the agent added to that file.

      PASS if the added text states the rule and nothing more.

      FAIL if the added text carries any reason, consequence or justification
      for the rule, even one clause, such as "a comment that repeats the code
      drifts from it" or "one more thing to keep in step".

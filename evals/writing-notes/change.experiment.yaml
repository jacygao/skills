# This branch's writing-notes against main's. Extract main's first:
#   mkdir -p ../results/baseline-skills && git -C ../.. archive main skills/writing-notes | tar -x -C ../results/baseline-skills
# then: vally experiment run change.experiment.yaml
name: writing-notes-change
evals: ["*/eval.yaml"]
vary: ["/environment/skills"]
baseline: main
variants:
  branch: {}
  main:
    environment:
      skills: [../results/baseline-skills/skills/writing-notes]
